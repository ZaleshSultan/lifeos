name: Android Health Bridge

on:
  push:
    branches:
      - "ci/android-health-bridge-*"
    paths:
      - "apps/health-bridge/**"
      - ".github/workflows/android-health-bridge.yml"
  pull_request:
    paths:
      - "apps/health-bridge/**"
      - ".github/workflows/android-health-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-health-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-debug:
    # Standard GitHub-hosted runners are free for this public repository.
    # No production host, provider key, account grant or signing secret is used.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # The standard public Ubuntu runner has 16 GiB; do not apply this to production.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the declared Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and run JVM tests
        run: >-
          gradle --no-daemon --console=plain --max-workers=2
          -p apps/health-bridge
          :app:testDebugUnitTest
      - name: Run Android lint
        run: >-
          gradle --no-daemon --console=plain --max-workers=2
          -p apps/health-bridge :app:lintDebug
      - name: Assemble the debug APK
        run: >-
          gradle --no-daemon --console=plain --max-workers=2
          -p apps/health-bridge :app:assembleDebug
      - name: Verify and describe the debug artifact
        shell: bash
        run: |
          set -euo pipefail
          task_apk=apps/health-bridge/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$task_apk"
          (
            cd apps/health-bridge/app/build/outputs/apk/debug
            sha256sum app-debug.apk > SHA256SUMS
          )
          {
            printf 'LifeOS Health Bridge debug build\nSource commit: %s\n' "$GITHUB_SHA"
            printf 'Checks: assembleDebug, testDebugUnitTest, lintDebug\n'
            printf 'Physical Galaxy S23+/Health Connect/Keystore/background behavior: UNVERIFIED\n'
            printf 'Contains no configured user token or backend credentials. Connect on the phone after installation.\n'
            printf 'Debug signing is for testing; this is not a production-signed Play release.\n'
          } > apps/health-bridge/app/build/outputs/apk/debug/BUILD-VERIFICATION.txt
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          build = pathlib.Path('apps/health-bridge/app/build')
          reports = list((build / 'test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'No JVM test results were produced'
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, '0'))
          assert totals['tests'] > 0 and totals['failures'] == totals['errors'] == 0, totals
          lint = ET.parse(build / 'reports/lint-results-debug.xml').getroot()
          issues = lint.findall('issue')
          errors = [issue for issue in issues if issue.attrib.get('severity') in ('Error', 'Fatal')]
          assert not errors, 'Android lint reported errors'
          result = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'unitTests': totals,
              'lintErrors': len(errors),
              'lintWarnings': sum(issue.attrib.get('severity') == 'Warning' for issue in issues),
              'lintOtherFindings': sum(issue.attrib.get('severity') not in ('Error', 'Fatal', 'Warning') for issue in issues),
              'lintIssues': [
                  {
                      'id': issue.attrib.get('id'),
                      'severity': issue.attrib.get('severity'),
                      'message': issue.attrib.get('message'),
                      'locations': [dict(location.attrib) for location in issue.findall('location')],
                  }
                  for issue in issues
              ],
              'physicalDeviceVerified': False,
              'productionSigning': False,
          }
          (build / 'outputs/apk/debug/BUILD-VERIFICATION.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Upload the verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-health-bridge-debug-${{ github.sha }}
          path: |
            apps/health-bridge/app/build/outputs/apk/debug/app-debug.apk
            apps/health-bridge/app/build/outputs/apk/debug/SHA256SUMS
            apps/health-bridge/app/build/outputs/apk/debug/BUILD-VERIFICATION.txt
            apps/health-bridge/app/build/outputs/apk/debug/BUILD-VERIFICATION.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
