name: Study checks

on:
  pull_request:
    branches: [main-v2]
  push:
    branches: [feature/study-intelligence-v5]

permissions:
  contents: read

concurrency:
  group: study-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable the package manager declared in package.json
        run: corepack enable

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install worker dependencies
        run: >-
          python -m pip install
          -r workers/reminder-worker/requirements.txt
          -r workers/obsidian-mirror/requirements.txt
          -r workers/google-sync/requirements.txt
          -r workers/ics-sync/requirements.txt
          -r workers/university-sync/requirements.txt

      - name: Typecheck the monorepo
        run: corepack pnpm typecheck

      - name: Run TypeScript tests
        run: corepack pnpm run test --maxWorkers=1

      - name: Run all worker tests
        run: corepack pnpm test:workers

      - name: Install disposable PostgreSQL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client

      - name: Check migrations, ownership, RLS and digest claims in an isolated database
        run: bash scripts/test-study-postgres.sh

      - name: Build the Mini App in the CI workspace
        run: corepack pnpm --filter @lifeos/tma build
        env:
          VITE_API_BASE_URL: ""
          VITE_BASE_PATH: /tma/
          VITE_ALLOW_MOCK_DATA: "false"
