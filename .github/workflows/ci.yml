name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/test-selfhost-deployment.sh
      - run: bash scripts/test-ideal-human-migration.sh
      - run: bash scripts/test-ai-budget-migration.sh
      - run: bash scripts/test-ai-router-migrations.sh
      - run: bash scripts/test-universal-capture-migration.sh
      - run: bash scripts/test-academic-concierge-migration.sh
      - run: bash scripts/test-daily-life-migration.sh
      - run: pnpm --filter @lifeos/tma build
      - run: pnpm --filter @lifeos/web build
      - run: node scripts/test-web-session-smoke.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r workers/university-sync/requirements.txt -r workers/ics-sync/requirements.txt
      - run: python3 -m unittest discover -s scripts/ops -p 'test_*.py'
      - run: bash scripts/test-finance-lookup-rls.sh
      - run: pnpm test:workers
      - run: bash scripts/test-lms-migration.sh
      - run: bash supabase/tests/test-assistant-migration.sh
      - run: bash scripts/test-web-session-migration.sh
      - run: bash scripts/test-security-migrations.sh
      - run: bash scripts/test-notification-deliveries.sh
      - run: bash scripts/test-obsidian-sync.sh
